name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # -----------------------------------------------------------
  # macOS — build, sign, notarize, DMG
  # -----------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read TrussC version
        id: trussc-ver
        run: echo "ref=$(cat .trussc-version)" >> "$GITHUB_OUTPUT"

      - name: Clone TrussC
        uses: actions/checkout@v4
        with:
          repository: TrussC-org/TrussC
          path: TrussC
          ref: ${{ steps.trussc-ver.outputs.ref }}

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTRUSSC_DIR="${GITHUB_WORKSPACE}/TrussC/trussc"

      - name: Build
        run: |
          cmake --build build -j$(sysctl -n hw.logicalcpu) 2>&1
          echo "=== build直下のファイル ==="
          find build -maxdepth 1
          
      - name: Find .app bundle
        id: find-app
        run: |
          echo "=== build ディレクトリの内容 ==="
          find build -type d | head -30

          APP_PATH=$(find build -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app バンドルが見つかりませんでした"
            exit 1
          fi

          echo "Found: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$(basename "$APP_PATH" .app)" >> "$GITHUB_OUTPUT"
          
      - name: Code Sign
        run: |
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: ANNO LAB INC. (EUTL4NVSG3)" \
            "${{ steps.find-app.outputs.app_path }}"

      - name: Create DMG
        run: |
          brew install create-dmg
          APP_NAME="${{ steps.find-app.outputs.app_name }}"
          create-dmg \
            --volname "$APP_NAME" \
            --volicon "icon/GvEncoder.icns" \
            --window-pos 200 120 \
            --window-size 640 480 \
            --icon-size 128 \
            --icon "${APP_NAME}.app" 160 200 \
            --app-drop-link 480 200 \
            --hide-extension "${APP_NAME}.app" \
            --hdiutil-quiet \
            "$RUNNER_TEMP/${APP_NAME}.dmg" \
            "${{ steps.find-app.outputs.app_path }}"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP_NAME="${{ steps.find-app.outputs.app_name }}"
          xcrun notarytool submit "$RUNNER_TEMP/${APP_NAME}.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple
        run: |
          APP_NAME="${{ steps.find-app.outputs.app_name }}"
          xcrun stapler staple "$RUNNER_TEMP/${APP_NAME}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ runner.temp }}/${{ steps.find-app.outputs.app_name }}.dmg

  # -----------------------------------------------------------
  # Windows — build, zip
  # -----------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read TrussC version
        id: trussc-ver
        shell: bash
        run: echo "ref=$(cat .trussc-version)" >> "$GITHUB_OUTPUT"

      - name: Clone TrussC
        uses: actions/checkout@v4
        with:
          repository: TrussC-org/TrussC
          path: TrussC
          ref: ${{ steps.trussc-ver.outputs.ref }}

      - name: Configure (CMake)
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DTRUSSC_DIR="${{ github.workspace }}/TrussC/trussc"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (zip)
        shell: bash
        run: |
          APP_NAME="GvEncoder"
          TAG="${GITHUB_REF_NAME}"
          # Find the Release output directory
          if [ -d "build/Release" ]; then
            DIST_DIR="build/Release"
          else
            DIST_DIR="build"
          fi
          mkdir -p "$RUNNER_TEMP/package"
          cp "$DIST_DIR"/*.exe "$RUNNER_TEMP/package/" 2>/dev/null || true
          cp "$DIST_DIR"/*.dll "$RUNNER_TEMP/package/" 2>/dev/null || true
          cd "$RUNNER_TEMP/package"
          7z a "$RUNNER_TEMP/${APP_NAME}-${TAG}-windows.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ runner.temp }}/GvEncoder-*.zip

  # -----------------------------------------------------------
  # Linux — build, tar.gz
  # -----------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read TrussC version
        id: trussc-ver
        run: echo "ref=$(cat .trussc-version)" >> "$GITHUB_OUTPUT"

      - name: Clone TrussC
        uses: actions/checkout@v4
        with:
          repository: TrussC-org/TrussC
          path: TrussC
          ref: ${{ steps.trussc-ver.outputs.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgtk-3-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRUSSC_DIR="${GITHUB_WORKSPACE}/TrussC/trussc"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package (tar.gz)
        run: |
          APP_NAME="GvEncoder"
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/package"
          cp build/${APP_NAME} "$RUNNER_TEMP/package/" 2>/dev/null || \
            find build -maxdepth 2 -type f -executable ! -name "*.cmake" -exec cp {} "$RUNNER_TEMP/package/" \;
          tar -czf "$RUNNER_TEMP/${APP_NAME}-${TAG}-linux.tar.gz" \
            -C "$RUNNER_TEMP/package" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: ${{ runner.temp }}/GvEncoder-*.tar.gz

  # -----------------------------------------------------------
  # Release — collect all artifacts and publish
  # -----------------------------------------------------------
  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            artifacts/**/* \
            --title "$TAG" \
            --generate-notes
