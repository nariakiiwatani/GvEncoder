name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: nariakiiwatani/TrussC/.github/workflows/release.yml@main
    with:
      trussc-repository: "nariakiiwatani/TrussC"
      bundle-id: "com.annolab.GvEncoder"
      sign-identity: "Developer ID Application: ANNO LAB INC. (EUTL4NVSG3)"
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    permissions:
      contents: write
